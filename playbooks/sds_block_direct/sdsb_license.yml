---
# ###################################################################
# Example : Create License Playbook
# ###################################################################
- name: Create License
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"
      # SSL options (all optional – see vsp_direct/ssl_connection_examples.yml):
      # validate_cert: false             # Validate storage SSL cert (default: false, changes to true in v5.0)
      # ca_cert: "/path/to/ca.pem"      # CA cert file/dir for self-signed certs
      # client_cert: "/path/to/client-cert.pem"  # Client cert for mTLS
      # client_key: "/path/to/client-key.pem"    # Client private key for mTLS
      # suppress_validate_cert_warning: false     # Suppress warning when validate_cert: false

    # Required: Specify the license key code
    license_key_code: "1LGB7VTDBH0J7QAQ3EEQM3O1VZLYBO1ER4HU7KXAN0DQ3GT6JW9NZCP1FS5IVAQ4BPF7DOO53TN"
    # Required: Specify the license ID to delete
    license_id_to_delete: "222c8201-805f-453d-99ac-0b21b8a66bd6"

  tasks:
  # ###################################################################
  # Task Name : Create License by Key Code
  # ###################################################################
    - name: Create license by registering key code
      hitachivantara.vspone_block.sds_block.hv_sds_block_license:
        state: present
        connection_info: "{{ connection_info }}"
        spec:
          key_code: "{{ license_key_code }}"
      register: create_result

    - name: Display create result
      ansible.builtin.debug:
        var: create_result

    ####################################################################
    # Task Name : Delete License by ID
    ####################################################################
    - name: Delete license by ID
      hitachivantara.vspone_block.sds_block.hv_sds_block_license:
        state: absent
        connection_info: "{{ connection_info }}"
        spec:
          id: "{{ license_id_to_delete }}"
      register: delete_result

    - name: Display delete result
      ansible.builtin.debug:
        var: delete_result
