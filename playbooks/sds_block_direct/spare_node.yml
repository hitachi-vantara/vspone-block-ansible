---
# ###################################################################
# Example : Spare Node Playbook
# ###################################################################
- name: Spare Node Configuration
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"
      # SSL options (all optional – see vsp_direct/ssl_connection_examples.yml):
      # validate_cert: false             # Validate storage SSL cert (default: false, changes to true in v5.0)
      # ca_cert: "/path/to/ca.pem"      # CA cert file/dir for self-signed certs
      # client_cert: "/path/to/client-cert.pem"  # Client cert for mTLS
      # client_key: "/path/to/client-key.pem"    # Client private key for mTLS
      # suppress_validate_cert_warning: false     # Suppress warning when validate_cert: false

  tasks:
    # ###############################################################################################
    # Task Name : Add a spare node to the SDS Block storage system
    # ###############################################################################################
    - name: Add a spare node to the SDS Block storage system
      hitachivantara.vspone_block.sds_block.hv_sds_block_spare_node:
        connection_info: "{{ connection_info }}"
        state: present
        spec:
          fault_domain_id: "21b15505-025d-400a-9f17-1b88e0a7ec98"
          control_port_ipv4_address: "10.76.34.106"
          setup_user_password: "setuppwd"
          bmc_name: "10.76.32.49"
          bmc_user: "adminuser"
          bmc_password: "somepasswd"

      register: result
    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    #################################################################################################
    # Task Name : Remove a spare node from the SDS Block storage system
    #################################################################################################
    - name: Remove a spare node from the SDS Block storage system
      hitachivantara.vspone_block.sds_block.hv_sds_block_spare_node:
        connection_info: "{{ connection_info }}"
        state: absent
        spec:
          id: "565772a4-5563-4932-a53d-1729d25152bd"

      register: result
    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    ################################################################################################
    # Task Name : Edit a spare node in the SDS Block storage system
    ################################################################################################
    - name: Edit a spare node in the SDS Block storage system
      hitachivantara.vspone_block.sds_block.hv_sds_block_spare_node:
        connection_info: "{{ connection_info }}"
        state: present
        spec:
          id: "565772a4-5563-4932-a53d-1729d25152bd"
          fault_domain_id: "21b15505-025d-400a-9f17-1b88e0a7ec98"
          control_port_ipv4_address: "10.76.34.106"
          setup_user_password: "setuppwd"
          bmc_name: "10.76.32.49"
          bmc_user: "adminuser"
          bmc_password: "somepasswd"

      register: result
    - name: Debug the result variable
      ansible.builtin.debug:
        var: result
