---
# ###################################################################
# Example : License Setting Update Playbook
# ###################################################################
- name: Update License Settings
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"
      # SSL options (all optional – see vsp_direct/ssl_connection_examples.yml):
      # validate_cert: false             # Validate storage SSL cert (default: false, changes to true in v5.0)
      # ca_cert: "/path/to/ca.pem"      # CA cert file/dir for self-signed certs
      # client_cert: "/path/to/client-cert.pem"  # Client cert for mTLS
      # client_key: "/path/to/client-key.pem"    # Client private key for mTLS
      # suppress_validate_cert_warning: false     # Suppress warning when validate_cert: false

  tasks:
    # ###################################################################
    # Task Name : Modify License Settings
    # ###################################################################
    - name: Modify license settings
      hitachivantara.vspone_block.sds_block.hv_sds_block_license_setting:
        state: present
        connection_info: "{{ connection_info }}"
        spec:
          warning_threshold_setting:
            remaining_days: 6
            total_pool_capacity_rate: -1
      register: result

    - name: Display result
      ansible.builtin.debug:
        var: result

    ####################################################################
    # Task Name : Modify License Settings for SDS Block on AWS cloud
    # Attribute "allow_over_capacity" is only for SDS Block on AWS cloud
    ####################################################################
    - name: Modify license settings
      hitachivantara.vspone_block.sds_block.hv_sds_block_license_setting:
        state: present
        connection_info: "{{ connection_info }}"
        spec:
          allow_over_capacity: false
          warning_threshold_setting:
            remaining_days: 6
            total_pool_capacity_rate: -1
      register: result

    - name: Display result
      ansible.builtin.debug:
        var: result
