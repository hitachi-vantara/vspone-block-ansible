---
- name: VSP Session Management
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"
      # SSL options (all optional – see vsp_direct/ssl_connection_examples.yml):
      # validate_cert: false             # Validate storage SSL cert (default: false, changes to true in v5.0)
      # ca_cert: "/path/to/ca.pem"      # CA cert file/dir for self-signed certs
      # client_cert: "/path/to/client-cert.pem"  # Client cert for mTLS
      # client_key: "/path/to/client-key.pem"    # Client private key for mTLS
      # suppress_validate_cert_warning: false     # Suppress warning when validate_cert: false

  tasks:
  # ###################################################################
  # Task Name : Create Session
  # ###################################################################
    - name: Create Session
      hitachivantara.vspone_block.vsp.hv_session:
        connection_info: "{{ connection_info }}"
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    #######################################################################
    # Task Name : Create a session with a maximum idle time of 200 seconds
    ######################################################################
    - name: Create a session with a maximum idle time of 200 seconds
      hitachivantara.vspone_block.vsp.hv_session:
        connection_info: "{{ connection_info }}"
        spec:
          alive_time_in_seconds: 200
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    #############################################################################
    # Task Name : Create a session with an authentication_timeout of 300 seconds.
    # Specify this value if an external authentication server is being used to
    # authenticate users.
    #############################################################################
    - name: Create a session with an authentication_timeout of 300 seconds.
      hitachivantara.vspone_block.vsp.hv_session:
        connection_info: "{{ connection_info }}"
        spec:
          authentication_timeout: 300
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    ####################################################################
    # Task Name : Delete Session
    ####################################################################
    - name: Delete Session
      hitachivantara.vspone_block.vsp.hv_session:
        connection_info: "{{ connection_info }}"
        state: "absent"
        spec:
          id: 15561
          token: "d7c7bd35d3854a9f973d934800fb70ab"
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result
