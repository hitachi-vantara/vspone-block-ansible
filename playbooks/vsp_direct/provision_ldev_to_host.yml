---
# ###################################################################
# Example : Provision ldev to host Playbook
# ###################################################################
- name: Provision ldev to host
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"
      # SSL options (all optional – see vsp_direct/ssl_connection_examples.yml):
      # validate_cert: false             # Validate storage SSL cert (default: false, changes to true in v5.0)
      # ca_cert: "/path/to/ca.pem"      # CA cert file/dir for self-signed certs
      # client_cert: "/path/to/client-cert.pem"  # Client cert for mTLS
      # client_key: "/path/to/client-key.pem"    # Client private key for mTLS
      # suppress_validate_cert_warning: false     # Suppress warning when validate_cert: false

  tasks:
    # ###################################################################
    # Task Name : Create ldev with direct connection
    # ###################################################################
    - name: Create ldev with direct connection
      hitachivantara.vspone_block.vsp.hv_ldev:
        connection_info: "{{ connection_info }}"
        state: "present"
        spec:
          pool_id: 15
          size: "1GB"
          name: "database_volume1"
          capacity_saving: "compression_deduplication"
          data_reduction_share: true
      register: result_create_ldev

    - name: Debug result_create_ldev
      ansible.builtin.debug:
        var: result_create_ldev

    ####################################################################
    # Task Name : Present ldev to host group with direct connection
    ####################################################################
    - name: Present ldev to host group with direct connection
      hitachivantara.vspone_block.vsp.hv_hg:
        connection_info: "{{ connection_info }}"
        state: "present"
        spec:
          state: "present_ldev"
          name: "hostgroup-server1"
          port_id: "CL1-A"
          ldevs: ["{{ result_create_ldev['volume']['ldev_id'] | int }}"]
      register: result_present_ldev

    - name: Debug result_present_ldev
      ansible.builtin.debug:
        var: result_present_ldev
