---
# ###################################################################
# Example : VSP One Snapshot Playbook
# ###################################################################
- name: VSP One Snapshot Module
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"
      # SSL options (all optional – see vsp_direct/ssl_connection_examples.yml):
      # validate_cert: false             # Validate storage SSL cert (default: false, changes to true in v5.0)
      # ca_cert: "/path/to/ca.pem"      # CA cert file/dir for self-signed certs
      # client_cert: "/path/to/client-cert.pem"  # Client cert for mTLS
      # client_key: "/path/to/client-key.pem"    # Client private key for mTLS
      # suppress_validate_cert_warning: false     # Suppress warning when validate_cert: false

  tasks:
    # #####################################################################################
    # Task Name : Create VSP one snapshot pairs
    # #####################################################################################
    - name: Create VSP one snapshot pairs
      hitachivantara.vspone_block.vsp.hv_vsp_one_snapshot:
        connection_info: "{{ connection_info }}"
        spec:
          new_snapshots:
            - master_volume_id: 37
              pool_id: 3
              snapshot_group_name: "rd_snapshot_group_37"
              type: "snapshot"
            - master_volume_id: 38
              pool_id: 3
              snapshot_group_name: "rd_snapshot_group_38"
              type: "snapshot"
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    ######################################################################################
    # Task Name : Map VSP one snapshot pair
    # #####################################################################################
    - name: Map VSP one snapshot pair
      hitachivantara.vspone_block.vsp.hv_vsp_one_snapshot:
        connection_info: "{{ connection_info }}"
        state: "map"
        spec:
          master_volume_id: 27
          snapshot_id: 7
          pool_id: 3
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    ######################################################################################
    # Task Name : Restore VSP one snapshot pair
    # #####################################################################################
    - name: Restore VSP one snapshot pair
      hitachivantara.vspone_block.vsp.hv_vsp_one_snapshot:
        connection_info: "{{ connection_info }}"
        state: "restore"
        spec:
          master_volume_id: 27
          snapshot_id: 7
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    ######################################################################################
    # Task Name : Delete VSP one snapshot pair
    # #####################################################################################
    - name: Delete VSP one snapshot pair
      hitachivantara.vspone_block.vsp.hv_vsp_one_snapshot:
        connection_info: "{{ connection_info }}"
        state: "absent"
        spec:
          master_volume_id: 27
          snapshot_id: 7
          should_delete_svol: true
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result
