---
# ###################################################################
# Example :  Remote connection through iSCSI management Playbook
# ###################################################################
- name: Remote Connection add and delete using iSCSI ports
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"
      # SSL options (all optional – see vsp_direct/ssl_connection_examples.yml):
      # validate_cert: false             # Validate storage SSL cert (default: false, changes to true in v5.0)
      # ca_cert: "/path/to/ca.pem"      # CA cert file/dir for self-signed certs
      # client_cert: "/path/to/client-cert.pem"  # Client cert for mTLS
      # client_key: "/path/to/client-key.pem"    # Client private key for mTLS
      # suppress_validate_cert_warning: false     # Suppress warning when validate_cert: false

  tasks:
    # #####################################################################################
    # Task Name : Register iSCSI ports
    # Perform this operation before creating/adding a iSCSI remote path to a remote connection.
    # #####################################################################################
    - name: Register iSCSI ports
      hitachivantara.vspone_block.vsp.hv_iscsi_remote_connection:
        connection_info: "{{ connection_info }}"
        state: present
        spec:
          local_port: CL1-C
          remote_port: CL1-C
          remote_storage_serial_number: 12345
          remote_storage_ip_address: "10.12.10.120"
          remote_tcp_port: 3260
      register: result

    - name: Debug result
      ansible.builtin.debug:
        var: result

    ######################################################################################
    # Task Name : Remove the registration of an iSCSI port
    ######################################################################################
    - name: Remove the registration of an iSCSI port
      hitachivantara.vspone_block.vsp.hv_iscsi_remote_connection:
        connection_info: "{{ connection_info }}"
        state: absent
        spec:
          local_port: CL1-C
          remote_port: CL1-C
          remote_storage_serial_number: 12345
      register: result

    - name: Debug result
      ansible.builtin.debug:
        var: result
