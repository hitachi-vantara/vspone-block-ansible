---
# ###################################################################
# Example :  Storage System Monitor Facts Playbook
# ###################################################################
- name: Storage System Monitor Facts
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"
      # SSL options (all optional – see vsp_direct/ssl_connection_examples.yml):
      # validate_cert: false             # Validate storage SSL cert (default: false, changes to true in v5.0)
      # ca_cert: "/path/to/ca.pem"      # CA cert file/dir for self-signed certs
      # client_cert: "/path/to/client-cert.pem"  # Client cert for mTLS
      # client_key: "/path/to/client-key.pem"    # Client private key for mTLS
      # suppress_validate_cert_warning: false     # Suppress warning when validate_cert: false

  tasks:
    # ###################################################################
    # Task Name : Get alerts information
    # ###################################################################
    - name: Get alerts information
      hitachivantara.vspone_block.vsp.hv_storage_system_monitor_facts:
        connection_info: "{{ connection_info }}"
        spec:
          alert_type: "CTL1"
          alert_start_number: 1
          alert_count: 2
          query: "alerts"
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    ###################################################################
    # Task Name : Get Hardware Installed information
    ###################################################################
    - name: Get Hardware Installed information
      hitachivantara.vspone_block.vsp.hv_storage_system_monitor_facts:
        connection_info: "{{ connection_info }}"
        spec:
          query: "hardware_installed"
          include_component_option: false
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    ####################################################################
    # Task Name : Get Channel Boards information
    ####################################################################
    - name: Get Channel Boards information
      hitachivantara.vspone_block.vsp.hv_storage_system_monitor_facts:
        connection_info: "{{ connection_info }}"
        spec:
          query: "channel_boards"
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result
