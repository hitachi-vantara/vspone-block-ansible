---
# ###################################################################
# Example :  Journal  Playbook
# ###################################################################
- name: Journal  Module
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml

  vars:
    # Common connection info for all tasks
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"
      # SSL options (all optional – see vsp_direct/ssl_connection_examples.yml):
      # validate_cert: false             # Validate storage SSL cert (default: false, changes to true in v5.0)
      # ca_cert: "/path/to/ca.pem"      # CA cert file/dir for self-signed certs
      # client_cert: "/path/to/client-cert.pem"  # Client cert for mTLS
      # client_key: "/path/to/client-key.pem"    # Client private key for mTLS
      # suppress_validate_cert_warning: false     # Suppress warning when validate_cert: false
  tasks:
    # ###################################################################
    # Task Name : Create a Journal using required details
    # ###################################################################
    - name: Create a Journal  using required details
      hitachivantara.vspone_block.vsp.hv_journal:
        connection_info: "{{ connection_info }}"
        state: "present"
        spec:
          journal_id: 37
          ldev_ids: [1993, 1994]
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    ####################################################################
    # Task Name : Update a Journal  using more details
    ####################################################################
    - name: Update a Journal  using other details
      hitachivantara.vspone_block.vsp.hv_journal:
        connection_info: "{{ connection_info }}"
        state: "update"
        spec:
          journal_id: 37
          data_overflow_watch_in_seconds: 60
          is_cache_mode_enabled: true
          mp_blade_id: 0
          mirror_unit_number: 0
          copy_pace: 3
          path_blockade_watch_in_minutes: 10
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    ####################################################################
    # Task Name : Expand Journal
    ####################################################################
    - name: Expand Journal
      hitachivantara.vspone_block.vsp.hv_journal:
        connection_info: "{{ connection_info }}"
        state: "expand_journal"
        spec:
          journal_id: 37
          ldev_ids: [1994]
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    ####################################################################
    # Task Name : Shrink Journal
    ####################################################################
    - name: Shrink Journal
      hitachivantara.vspone_block.vsp.hv_journal:
        connection_info: "{{ connection_info }}"
        state: "shrink_journal"
        spec:
          journal_id: 37
          ldev_ids: [1994]
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result

    ####################################################################
    # Task Name : Delete Journal  by ID
    ####################################################################
    - name: Delete Journal  by ID
      hitachivantara.vspone_block.vsp.hv_journal:
        connection_info: "{{ connection_info }}"
        state: "absent"
        spec:
          journal_id: 37
      register: result

    - name: Debug the result variable
      ansible.builtin.debug:
        var: result
